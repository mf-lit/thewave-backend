services:
  # The API and the availability worker share one image and one SQLite file
  # (WAL mode), but run as separate containers so that if either dies, Docker
  # restarts it. They used to be two background processes behind one bash
  # entrypoint, where a dead worker left the container "up" and silent.
  notifications-api:
    build:
      context: ./notifications
      dockerfile: Dockerfile
    container_name: thewave-notifications-api
    networks:
      default:
        aliases:
          # The Cloudflare tunnel's ingress rules for wave-notifications.vq5.net
          # and wave-notifications-oci.vq5.net point at http://thewave-notifications:5001,
          # which used to be this service's container name. The alias keeps that
          # DNS name resolving so the split needs no change in Cloudflare.
          - thewave-notifications
    ports:
      - "5001:5001"
    volumes:
      # Mount config directory (read-only)
      - /thewave/docker_vols/notifications/config:/app/config:ro
      # Mount data directory for SQLite database persistence
      - /thewave/docker_vols/notifications/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  notifications-worker:
    build:
      context: ./notifications
      dockerfile: Dockerfile
    container_name: thewave-notifications-worker
    command: ["uv", "run", "python", "-m", "src.worker"]
    volumes:
      - /thewave/docker_vols/notifications/config:/app/config:ro
      - /thewave/docker_vols/notifications/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      # The worker touches this file at the end of every check cycle.
      test: ["CMD-SHELL", "find /app/data/worker-heartbeat -newermt '-10 minutes' | grep -q ."]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  upstream-api:
    build:
      context: ./upstream-api
      dockerfile: Dockerfile
    container_name: thewave-upstream-api
    ports:
      - "5000:5000"
    volumes:
      # Mount config directory for API keys and upstream API URL
      - /thewave/docker_vols/upstream-api/config:/app/config:ro
      # Mount data directory for database and history files (read-write)
      - /thewave/docker_vols/upstream-api/data:/app/data
      - /thewave/docker_vols/shared:/app/shared
    environment:
      # Optional: Override port (default: 5000)
      - PORT=5000
      # Optional: Cache configuration
      - CACHE_TTL_SECONDS=540
      
      # Optional: Forecast and temperature settings
      # - FORECAST_RELOAD_HOUR=1
      # - HISTORICAL_TEMP_CACHE_SIZE=256
      # - DB_TIMEOUT=30.0
      
      # Optional: Test mode (uses dummy data)
      # - TEST_MODE=false
      
      # Python settings
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - FLASK_ENV=production

      # Prevent clients forcing refresh. Unquoted deliberately: compose passes
      # list-form values through verbatim, so "false" arrives with its quotes
      # and reads as a non-empty string that is not the literal false.
      - ALLOW_FORCE_REFRESH=false
      # Cap the calendar window a single request may ask for. Seven is the
      # widest view any client has: the schedule shows at most seven columns,
      # and the notifications worker chunks its batches to match.
      - MAX_NUMBER_OF_DAYS=7
      - OVPN_FLAG_FILE=/app/shared/ovpn_flag
      - PROXY_HEALTH_FILE=/app/shared/proxy_health
    restart: unless-stopped

  webapp:
    build:
      # The Flutter app lives in a separate repo. The image is a thin nginx that
      # only copies build/web, so deploy/build.sh must have run there first —
      # see that repo's /deploy-web skill, which owns the order.
      context: /home/marc/waveform
      dockerfile: deploy/Dockerfile
    container_name: thewave-webapp
    ports:
      # Reached publicly as waveform.vq5.net via the tunnel over the docker
      # network; this binding is only for local checks, so keep it off the LAN
      # like dashboard/sqlite-web.
      - "${TAILSCALE_IP}:5004:80"
    environment:
      # nginx injects this as x-api-key on its two /api/* proxy_pass blocks, so
      # the browser bundle carries no key. Its own entry in upstream-api's
      # config.yaml, revocable without touching installed mobile apps.
      - UPSTREAM_API_KEY=${WEBAPP_UPSTREAM_API_KEY}
    restart: unless-stopped

  log-alerter:
    build: ./log-alerts
    restart: unless-stopped
    environment:
      - WIREPUSHER_ID=AHTpmpGRm    # from the WirePusher app
      - WIREPUSHER_TYPE=log-alert       # optional, customize in the app under "Types"
      - LOG_PATTERN=error|exception|fatal|panic
      - COOLDOWN=60
      - CONTAINERS=thewave-notifications-api thewave-notifications-worker thewave-upstream-api thewave-webapp          # leave unset to watch all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  pia-openvpn-proxy:
    build:
      context: ./pia-openvpn-proxy
      dockerfile: Dockerfile
    container_name: pia-openvpn-proxy
    cap_add:
      - MKNOD
      - NET_ADMIN
    devices:
      - /dev/net/tun
        #    dns:
        #- 209.222.18.218
        #- 209.222.18.222
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /thewave/docker_vols/pia-openvpn-proxy/config:/config
      - /thewave/docker_vols/shared:/shared
    # if using wireguard, uncomment the next line
    #privileged: true
    environment:
      - VPN_PROTOCOL=openvpn
      - USERNAME=${PIAUNAME}
      - PASSWORD=${PIAPASS}
      - UID=1000
      - GID=1000
      - LOCAL_NETWORK=10.0.1.0/24
    ports:
      - 8119:8118
    restart: always

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: thewave-dashboard
    ports:
      # Admin-only tool: bind to the Tailscale interface, not the LAN.
      - "${TAILSCALE_IP}:5002:5002"
    volumes:
      # Not mounted :ro — these DBs are WAL-mode, so even read-only queries need
      # to create -wal/-shm sidecar files in the directory (see sqlite-web below,
      # which mounts the same paths the same way). The app itself only ever
      # opens them with sqlite mode=ro and never writes real data.
      - /thewave/docker_vols/upstream-api/data:/data/upstream-api
      - /thewave/docker_vols/notifications/data:/data/notifications
      # Dashboard's own writable store (end-of-day active-client snapshots)
      - /thewave/docker_vols/dashboard/data:/app/data
    environment:
      - UPSTREAM_DB_PATH=/data/upstream-api/water_temperature.db
      - NOTIFICATIONS_DB_PATH=/data/notifications/notifications.db
      - DAILY_ACTIVE_DB_PATH=/app/data/daily_active.db
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
    restart: unless-stopped

  sqlite-web:
    build:
      context: ./sqlite-web
      dockerfile: Dockerfile
    container_name: sqlite-web
    restart: unless-stopped
    ports:
      # No auth in sqlite-web itself: bind to the Tailscale interface, not the LAN.
      - "${TAILSCALE_IP}:5003:8080"
    volumes:
      - /thewave/docker_vols/notifications/data:/notifications/data
      - /thewave/docker_vols/upstream-api/data:/upstream-api/data
    command: /notifications/data/notifications.db /upstream-api/data/water_temperature.db /upstream-api/data/prices.db

