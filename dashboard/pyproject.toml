[project]
name = "thewave-dashboard"
version = "0.1.0"
description = "Web dashboard for The Wave client usage and notifications"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "gunicorn>=21.2.0",
    # The Messages page proxies the messages service's admin API.
    "requests>=2.31.0",
    # python:3.12-slim ships no system zoneinfo, and the compose form is
    # Europe/London wall-clock.
    "tzdata>=2024.1",
]

[tool.uv]
package = false
