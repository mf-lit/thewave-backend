[project]
name = "notifications"
version = "1.0.0"
description = "Session availability notifications for the waveform mobile app"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "gunicorn>=21.2.0",
    "requests>=2.31.0",
    "firebase-admin>=6.4.0",
    "pyyaml>=6.0.0",
    # python:3.11-slim ships no system zoneinfo, and session times are
    # Europe/London wall-clock.
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
